[package]
name = "korgnote-server"
version = "0.1.0"
edition = "2024"
description = "The KorgNote sync server, in Rust: the same server as the Kotlin one in ../server, for computers with little memory."
license = "GPL-3.0-or-later"
publish = false

[dependencies]
bytes = "1.12.2"
flate2 = "1.1.11"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = { version = "0.4.3", features = ["sys_rng"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "http1", "http2", "service"] }
libc = "0.2.191"
nix = { version = "0.32.0", features = ["net", "user"] }
notify = { version = "8.2.2", default-features = false, features = ["macos_fsevent"] }
p12-keystore = "0.4.1"
qrcodegen = "1.8.0"
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "tls12", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
socket2 = { version = "0.6.5", features = ["all"] }
time = "0.3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal", "io-util", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
