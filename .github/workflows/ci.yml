# T19 — a gate, not a pipeline: every push to master runs every test that can run on Linux and
# compiles every target that has none. The iOS simulator tests need macOS, whose minutes count 10x on
# a private repository, so they run nightly — and only on nights when master actually changed. So
# does the long sweep of random sync sessions, of which every push plays only a few.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: Also run the iOS simulator tests
        type: boolean
        default: true
      sweep:
        description: Also run the long sweep of random sync sessions
        type: boolean
        default: true
  # GitHub starts scheduled runs late when it is busy, and busiest on the hour: "0 3" ran at 08:00
  # to 10:00. An odd minute gets there sooner. The nightly jobs only.
  schedule:
    - cron: "37 1 * * *"

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (JVM, server, wasm) + Android build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # The wasm tests run in headless Chrome, which the Ubuntu runner image ships with. The Android
      # SDK is preinstalled too; AGP downloads the compileSdk platform if it is missing.
      - name: Test and build
        run: >
          ./gradlew --continue
          :shared:jvmTest :shared:wasmJsTest
          :composeApp:jvmTest :composeApp:wasmJsTest
          :server:test
          :composeApp:wasmJsBrowserDistribution
          :androidApp:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-linux
          path: "**/build/reports/tests/"
          retention-days: 14

  # Scheduled runs only: is there anything on master the nightly jobs have not passed on yet? Asked
  # of the last scheduled run that passed rather than of the last 25 hours, which a run starting
  # later than the one before could skip a commit through — and a failed night is tried again.
  changed:
    name: Master changed since the last good night?
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      recent: ${{ steps.check.outputs.recent }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event schedule \
            --branch master --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ "$last" != "$GITHUB_SHA" ]; then
            echo "recent=true" >> "$GITHUB_OUTPUT"
          else
            echo "recent=false" >> "$GITHUB_OUTPUT"
          fi

  sweep:
    name: Random sync sessions, long sweep
    needs: changed
    if: >
      always() && (
        (github.event_name == 'schedule' && needs.changed.outputs.recent == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.sweep)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Random sync sessions
        run: >
          ./gradlew :shared:jvmTest --tests com.korgnote.common.SyncEngineRandomTests
          -PrandomSeeds=10000

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-sweep
          path: "**/build/reports/tests/"
          retention-days: 14

  ios:
    name: iOS simulator tests
    needs: changed
    if: >
      always() && (
        (github.event_name == 'schedule' && needs.changed.outputs.recent == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.ios)
      )
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # The Kotlin/Native toolchain is a few hundred megabytes; setup-gradle does not cache it.
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: iOS simulator tests
        run: ./gradlew --continue :shared:iosSimulatorArm64Test :composeApp:iosSimulatorArm64Test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-ios
          path: "**/build/reports/tests/"
          retention-days: 14
