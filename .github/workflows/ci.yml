# T19 — a gate, not a pipeline: every push to master runs every test that can run on Linux and
# compiles every target that has none. The iOS simulator tests need macOS, whose minutes count 10x on
# a private repository, so they run nightly — and only on nights when master actually changed.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: Also run the iOS simulator tests
        type: boolean
        default: true
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC, iOS only

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (JVM, server, wasm) + Android build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # The wasm tests run in headless Chrome, which the Ubuntu runner image ships with. The Android
      # SDK is preinstalled too; AGP downloads the compileSdk platform if it is missing.
      - name: Test and build
        run: >
          ./gradlew --continue
          :shared:jvmTest :shared:wasmJsTest
          :composeApp:jvmTest :composeApp:wasmJsTest
          :server:test
          :composeApp:wasmJsBrowserDistribution
          :androidApp:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-linux
          path: "**/build/reports/tests/"
          retention-days: 14

  # Scheduled runs only: is there anything on master the iOS job has not seen yet?
  changed:
    name: Master changed in the last day?
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      recent: ${{ steps.check.outputs.recent }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - id: check
        run: |
          if [ -n "$(git log --since='25 hours ago' --format=%H -1)" ]; then
            echo "recent=true" >> "$GITHUB_OUTPUT"
          else
            echo "recent=false" >> "$GITHUB_OUTPUT"
          fi

  ios:
    name: iOS simulator tests
    needs: changed
    if: >
      always() && (
        (github.event_name == 'schedule' && needs.changed.outputs.recent == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.ios)
      )
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # The Kotlin/Native toolchain is a few hundred megabytes; setup-gradle does not cache it.
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: iOS simulator tests
        run: ./gradlew --continue :shared:iosSimulatorArm64Test :composeApp:iosSimulatorArm64Test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-ios
          path: "**/build/reports/tests/"
          retention-days: 14
