# The server's image, for amd64 and arm64, on the GitHub Container Registry. A version tag pushed by
# scripts/publish.sh builds it as ghcr.io/<owner>/korgnote-server:X.Y.Z, X.Y and latest; publish.sh
# waits for this run before it publishes the release. To build a tag again, on a newer base image
# for its security fixes, run the workflow from the Actions tab with that tag as the ref. Building an
# older tag again moves latest back to it.
name: Container

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Server image (amd64, arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Run on a version tag only
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "::error::Run this on a version tag, not ${{ github.ref }}."
          exit 1

      - uses: actions/checkout@v7

      # No QEMU: the Dockerfile builds on the runner's own platform and only copies files for the
      # other, so neither CPU is emulated.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tags from the version, and the OCI labels that tie the package to this repository.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/korgnote-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=KorgNote server
            org.opencontainers.image.description=The KorgNote sync server, with the web client

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Where it was built from and what is in it, for anyone who wants to check.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
