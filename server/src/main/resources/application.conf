ktor {
  deployment {
    host = "0.0.0.0"
    # HTTPS-only server: expose only SSL/TLS port. Adjust if needed.
    sslPort = 8080
  }
  security {
    ssl {
      keyStore = "build/keystore.jks"
      keyAlias = "selfsigned"
      keyStorePassword = "changeit"
      privateKeyPassword = "changeit"
    }
  }
  application {
    modules = [ com.korgnote.server.ApplicationKt.module ]
  }
}
